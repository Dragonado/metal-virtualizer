syntax = "proto3";
package tnrc;

service TnrcService {
  rpc CreateSystemDefaultDeviceShim(CreateSystemDefaultDeviceShimRequest) returns (CreateSystemDefaultDeviceShimResponse);
  rpc CreateCommandQueueShim(CreateCommandQueueShimRequest) returns (CreateCommandQueueShimResponse);
  rpc CreateLibraryShim(CreateLibraryShimRequest) returns (CreateLibraryShimResponse);
  rpc CreateFunctionShim(CreateFunctionShimRequest) returns (CreateFunctionShimResponse);
  rpc ReleaseFunctionShim(ReleaseFunctionShimRequest) returns (ReleaseFunctionShimResponse);
  rpc CreateComputePipelineStateShim(CreateComputePipelineStateShimRequest) returns (CreateComputePipelineStateShimResponse);
  rpc CreateBufferShim(CreateBufferShimRequest) returns (CreateBufferShimResponse);
}

message CreateSystemDefaultDeviceShimRequest {}

message CreateSystemDefaultDeviceShimResponse {
  uint32 device_id = 1;
  string device_name = 2;
}

message CreateCommandQueueShimRequest {
  uint32 device_id = 1;
}

message CreateCommandQueueShimResponse {
  uint32 command_queue_id = 1;
}

message CreateLibraryShimRequest {
  uint32 device_id = 1;
  string source = 2;
  // TODO: Add options and error
}

message CreateLibraryShimResponse {
  uint32 library_id = 1;
}

message CreateFunctionShimRequest {
  uint32 library_id = 1;
  string function_name = 2;
  // TODO: Add options and error
}

message CreateFunctionShimResponse {
  uint32 function_id = 1;
}

message ReleaseFunctionShimRequest {
  uint32 function_id = 1;
}

message ReleaseFunctionShimResponse {}

message CreateComputePipelineStateShimRequest {
  uint32 device_id = 1;
  uint32 function_id = 2;
  // TODO: error
}

message CreateComputePipelineStateShimResponse {
  uint32 compute_pipeline_state_id = 1;
  sint64 max_total_threads_per_threadgroup = 2;
}

message MaxTotalThreadsPerThreadgroupShimRequest {
  uint32 compute_pipeline_state_id = 1;
}

message CreateBufferShimRequest {
  uint32 device_id = 1;
  uint64 length = 2;
  uint64 options = 3;
}

message CreateBufferShimResponse {
  uint32 buffer_id = 1;
}
